[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "gelanruo-ai"
version = "0.1.0"
description = "钉钉企业 AI 助手：会话、检索与图片任务"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.28,<1",
  "sqlalchemy>=2.0,<3", "psycopg[binary]>=3.2,<4",
  "dingtalk-stream==0.24.3", "python-dotenv>=1,<2",
  "pillow>=11,<13", "filelock>=3.16,<4", "qrcode>=8,<9"
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
gelanruo = "app.cli:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
